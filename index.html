collection(db,"centralMessages"),
orderBy("createdAt","asc")
);


centralUnsub =
onSnapshot(
q,
snapshot=>{

const messages =
snapshot.docs.map(
doc=>doc.data()
);


$("msgs").innerHTML =
messages.length

?

messages.map(message=>`

<div class="msg ${
message.uid===me.uid
?"mine"
:""
}">

<div class="msgmeta">

${escapeHTML(message.name)}

•

${escapeHTML(message.sector)}

•

${formatDate(message.createdAt)}

</div>

${escapeHTML(message.text)}

</div>

`).join("")

:

`<div class="empty">
لا توجد رسائل بعد
</div>`;


$("msgs").scrollTop =
$("msgs").scrollHeight;

}
);

}


$("sendChat").onclick =
async function(){

const text =
$("chatInput").value.trim();

if(!text)
return;


await addDoc(
collection(db,"centralMessages"),
{

text:text,

uid:me.uid,

name:profile.name,

sector:profile.sector,

createdAt:
serverTimestamp()

}
);


$("chatInput").value="";

};


$("chatInput").onkeydown =
function(e){

if(e.key==="Enter")
$("sendChat").click();

};


/* ================= PRIVATE CHAT ================= */

function renderPrivateUsers(){

const others =
users.filter(
user=>user.id!==me.uid
);


$("privateUsers").innerHTML =
others.length

?

others.map(user=>`

<div
class="room"
onclick="selectPrivate('${user.id}')"
>

<b>
${escapeHTML(user.name)}
</b>

<br>

<span class="muted">

${escapeHTML(user.sector)}

•

${escapeHTML(user.role)}

</span>

</div>

`).join("")

:

`<div class="empty">
لا يوجد أعضاء آخرون
</div>`;

}


window.selectPrivate =
function(id){

privateTarget=id;

const target =
users.find(
user=>user.id===id
);

if(target)
startPrivateChat(target);

};


function startPrivateChat(target){

if(privateUnsub)
privateUnsub();


const roomId =
[me.uid,target.id]
.sort()
.join("_");


const q =
query(
collection(
db,
"privateChats",
roomId,
"messages"
),
orderBy("createdAt","asc")
);


privateUnsub =
onSnapshot(
q,
snapshot=>{

const messages =
snapshot.docs.map(
doc=>doc.data()
);


$("privateMsgs").innerHTML =
messages.length

?

messages.map(message=>`

<div
class="msg ${
message.uid===me.uid
?"mine"
:""
}"
>

<div class="msgmeta">

${escapeHTML(message.name)}

•

${formatDate(message.createdAt)}

</div>

${escapeHTML(message.text)}

</div>

`).join("")

:

`<div class="empty">
لا توجد رسائل
</div>`;

}
);

}


$("sendPrivate").onclick =
async function(){

if(!privateTarget){

alert(
"اختر شخصًا أولًا"
);

return;

}


const text =
$("privateInput").value.trim();

if(!text)
return;


const roomId =
[me.uid,privateTarget]
.sort()
.join("_");


await addDoc(
collection(
db,
"privateChats",
roomId,
"messages"
),
{

text:text,

uid:me.uid,

name:profile.name,

sector:profile.sector,

createdAt:
serverTimestamp()

}
);


$("privateInput").value="";

};


/* ================= FILES ================= */

$("uploadBtn").onclick =
async function(){

const file =
$("fileInput").files[0];

if(!file){

alert(
"اختر ملفًا أولًا"
);

return;

}


$("uploadState").textContent =
"جاري الرفع...";


try{

const path =
`uploads/${profile.sector}/${me.uid}/${Date.now()}_${file.name}`;


const fileRef =
ref(storage,path);


await uploadBytes(
fileRef,
file
);


const url =
await getDownloadURL(
fileRef
);


await addDoc(
collection(db,"files"),
{

name:file.name,

url:url,

path:path,

sector:profile.sector,

uploadedBy:me.uid,

uploadedByName:profile.name,

size:file.size,

createdAt:
serverTimestamp()

}
);


$("uploadState").textContent =
"تم الرفع بنجاح";

$("fileInput").value="";


}catch(error){

$("uploadState").textContent =
"فشل الرفع";

alert(error.message);

}

};
